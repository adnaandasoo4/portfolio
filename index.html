<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- SEO -->
    <meta
      name="description"
      content="Adnaan Dasoo — software engineer & creative developer building motion-driven, intentional digital experiences. Based in Baltimore."
    />
    <meta name="author" content="Adnaan Dasoo" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2EFE9" media="(prefers-color-scheme: light)" />

    <!-- Open Graph (LinkedIn, Slack, Discord, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adnaandasoo.com" />
    <meta property="og:title" content="Adnaan Dasoo — Software Engineer · Creative Developer" />
    <meta
      property="og:description"
      content="Frontend engineering with a love for motion, intention, and craft. Building digital experiences for brands that want their corner of the internet to feel a little more alive."
    />
    <meta property="og:image" content="https://adnaandasoo.com/favicon.png" />
    <meta property="og:site_name" content="Adnaan Dasoo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Adnaan Dasoo — Software Engineer · Creative Developer" />
    <meta
      name="twitter:description"
      content="Frontend engineering with a love for motion, intention, and craft."
    />
    <meta name="twitter:image" content="https://adnaandasoo.com/favicon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://adnaandasoo.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload Clash Display so the Hero wordmark renders without a
         fallback flash. -->
    <link
      rel="preload"
      href="/fonts/clash-display/ClashDisplay-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Pre-paint palette to avoid the default-lime accent flash before the
      // PaletteProvider effect runs. Key "palette" + ids must match
      // src/utils/palette.jsx.
      (function () {
        var ids = ["green", "sage", "oxblood", "blue", "graphite", "onyx"];
        var palette = "green";
        try {
          var stored = localStorage.getItem("palette");
          if (ids.indexOf(stored) !== -1) palette = stored;
        } catch (e) {
          // localStorage unavailable — fall through to default.
        }
        document.documentElement.setAttribute("data-palette", palette);
      })();
    </script>
    <title>Adnaan Dasoo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
