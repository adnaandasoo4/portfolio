<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload Clash Display so the Hero wordmark renders without a
         fallback flash. -->
    <link
      rel="preload"
      href="/fonts/clash-display/ClashDisplay-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Pre-paint theme to avoid flash. Read localStorage first, fall back to OS preference, default light.
      // Key "theme" must match src/utils/theme.jsx.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || stored === "light") {
            theme = stored;
          } else if (prefersDark) {
            theme = "dark";
          }
        } catch (e) {
          // localStorage may be unavailable (private browsing, etc.). Fall through to default.
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Adnaan Dasoo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
